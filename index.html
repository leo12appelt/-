<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Corpo da calculadora-->
    <div class="calculadora">
        <input id="display" readonly><br>

    <!--botões-->
        <button class="limpar" onclick="limpar()">C</button><button class="limpar" onclick="apagarCaractere()">←</button><button class="calculo" onclick="salvar()">copy</button><button class="calculo" onclick="colar()">paste</button><br>
        <button onclick="add(7)">7</button><button onclick="add(8)">8</button><button onclick="add(9)">9</button><button class="calculo"  onclick="add('*')">X</button><br>
        <button onclick="add(4)">4</button><button onclick="add(5)">5</button><button onclick="add(6)">6</button><button class="calculo" onclick="add('-')">-</button><br>
        <button onclick="add(1)">1</button><button onclick="add(2)">2</button><button onclick="add(3)">3</button><button class="calculo" onclick="add('+')">+</button><br>
        <button onclick="add('.')">,</button><button onclick="add(0)">0</button><button class="calculo" onclick="add('/')">÷</button><button class="resultado" onclick="calcular()">=</button>
    </div>
    <!--autoria ;)-->
    <div class="credito">
        Leonardo Carlos dos Santos Appelt
    </div>
    <script src="script.js"></script>
</body>
</html>
